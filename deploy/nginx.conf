# Film page. Every response header is set in the one server block below; no location adds its own (an add_header
# inside a location would drop the inherited ones). Cache lifetimes are chosen per path by the map.
client_body_temp_path /tmp/client_body;
proxy_temp_path /tmp/proxy;
fastcgi_temp_path /tmp/fastcgi;
uwsgi_temp_path /tmp/uwsgi;
scgi_temp_path /tmp/scgi;

map $uri $river_cache {
  default                 "no-cache, no-transform";
  /healthz                "no-store";
  ~^/(media|img)/         "public, max-age=31536000, immutable";
  ~\.(css|js)$            "public, max-age=3600";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  charset utf-8;
  index index.html;
  absolute_redirect off;
  charset_types text/css application/javascript text/plain;

  add_header Content-Security-Policy "default-src 'self'; img-src 'self'; media-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cache-Control $river_cache always;

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  # Videos: plain files, so nginx answers byte ranges (206) for seeking and for iPhone playback.
  location /media/ {
    limit_except GET HEAD { deny all; }
    try_files $uri =404;
  }

  location / {
    limit_except GET HEAD { deny all; }
    try_files $uri $uri/ =404;
  }
}
